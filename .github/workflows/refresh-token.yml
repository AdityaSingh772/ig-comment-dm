name: refresh-token

# Only for the older Instagram Login (IG_LOGIN=instagram, 60-day tokens).
# The default Unified Login token is set to never expire, so the weekly
# schedule is off. Run by hand only if you switch back to Instagram Login.
on:
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh and store token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}   # fine-grained PAT: this repo only, Secrets read/write
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$GH_TOKEN" ]; then echo "secrets not set yet, skipping"; exit 0; fi
          NEW=$(python ig_comment_dm.py refresh)
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
